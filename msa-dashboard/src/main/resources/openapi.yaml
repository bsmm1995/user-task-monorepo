openapi: 3.1.0
info:
  title: Dashboard Aggregator Service API
  description: "BFF (Backend for Frontend) service that aggregates data from User and Task services to provide consolidated views."
  contact:
    name: Support Team
    email: support@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: "1.0.0"
servers:
  - url: http://localhost:8083
    description: Local server
tags:
  - name: Dashboard
    description: Aggregated data endpoints
paths:
  /api/v1/dashboard/{userId}:
    get:
      tags:
        - Dashboard
      summary: Get user dashboard
      description: Retrieves a consolidated view containing user details and their task statistics.
      operationId: getUserDashboard
      parameters:
        - name: userId
          in: path
          description: ID of the user to retrieve the dashboard for
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDashboardResponse"
              example:
                data:
                  user:
                    id: 1
                    fullName: Junie AI
                    email: junie@example.com
                  statistics:
                    totalTasks: 5
                    pendingTasks: 2
                    completedTasks: 3
                    completionRate: 60.0
                  recentTasks:
                    - id: 101
                      title: Update Documentation
                      status: COMPLETED
                      updatedAt: "2026-04-07T01:00:00Z"
                    - id: 102
                      title: Fix Bugs
                      status: PENDING
                      updatedAt: "2026-04-07T01:30:00Z"
        "400":
          description: Bad Request - Invalid userId format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: BAD_REQUEST
                  message: "Failed to convert 'userId' to Long"
                  path: /api/v1/dashboard/abc
                  timestamp: "2026-04-07T02:00:00.000Z"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseNotFound"
              example:
                error:
                  code: USER_NOT_FOUND
                  message: "User not found with id: 1"
                  path: /api/v1/dashboard/1
                  timestamp: "2026-04-06T21:37:00.6109828-05:00"
        "500":
          description: Internal Server Error - Potential timeout or communication failure with underlying services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INTERNAL_SERVER_ERROR
                  message: An unexpected error occurred while aggregating dashboard data
                  path: /api/v1/dashboard/1
                  timestamp: "2026-04-07T02:00:00.000Z"
        "502":
          description: Bad Gateway - Upstream service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: BAD_GATEWAY
                  message: Failed to retrieve user information from msa-user-mgmt
                  path: /api/v1/dashboard/1
                  timestamp: "2026-04-07T02:00:00.000Z"
components:
  schemas:
    DashboardResponse:
      type: object
      description: Consolidated dashboard data
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        statistics:
          $ref: "#/components/schemas/TaskStatistics"
        recentTasks:
          type: array
          description: List of most recent tasks
          items:
            $ref: "#/components/schemas/TaskSummary"
      required:
        - user
        - statistics
    UserSummary:
      type: object
      description: Simplified user information
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
          description: Concatenated first and last name
        email:
          type: string
          format: email
      required:
        - id
        - fullName
        - email
    TaskStatistics:
      type: object
      description: Calculated metrics for tasks
      properties:
        totalTasks:
          type: integer
          format: int32
        pendingTasks:
          type: integer
          format: int32
        completedTasks:
          type: integer
          format: int32
        completionRate:
          type: number
          format: double
          description: Percentage of completed tasks (0.0 to 100.0)
      required:
        - totalTasks
        - pendingTasks
        - completedTasks
        - completionRate
    TaskSummary:
      type: object
      description: Simplified task information
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
    GetDashboardResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DashboardResponse"
    ErrorBodyNotFound:
      type: object
      description: Error Details Body (No details for Not Found)
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error message
          example: User not found
        path:
          type: string
          description: URI path where the error occurred
          example: /api/v1/dashboard/1
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error
    ErrorBody:
      type: object
      description: Error Details Body
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error message
          example: User not found
        path:
          type: string
          description: URI path where the error occurred
          example: /api/v1/dashboard/1
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error
        details:
          type: array
          description: "List of specific error details (e.g., validation failures)"
          nullable: true
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      description: Specific Error Detail
      properties:
        field:
          type: string
          description: Field name that caused the error
          example: userId
        code:
          type: string
          description: Validation error code
          example: INVALID_FORMAT
        message:
          type: string
          description: Detailed validation message
          example: ID should be valid
    ErrorResponseNotFound:
      type: object
      description: Standard Error Response Envelope (No details)
      properties:
        error:
          $ref: "#/components/schemas/ErrorBodyNotFound"
          description: Error body (without details)
    ErrorResponse:
      type: object
      description: Standard Error Response Envelope
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
          description: Error body containing details
