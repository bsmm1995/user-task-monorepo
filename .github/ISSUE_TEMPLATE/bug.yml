name: Bug Report
description: Reporta un bug encontrado
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Ayúdanos a entender y resolver el problema.

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Describe el bug claramente
      placeholder: "El endpoint POST /users falla cuando..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: |
        Pasos específicos para reproducir el problema:
        1. Ejecuta `./gradlew build`
        2. Corre el servicio
        3. Llama al endpoint
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería suceder
      placeholder: "El endpoint debería retornar 200 con el usuario creado"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué está sucediendo realmente
      placeholder: "El endpoint retorna 500 con error NullPointerException"
    validations:
      required: true

  - type: input
    id: service
    attributes:
      label: Servicio afectado
      description: "Ej: msa-user-mgmt, msa-task-mgmt, etc."
      placeholder: "msa-user-mgmt"

  - type: textarea
    id: logs
    attributes:
      label: Logs de error
      description: Pega los logs si hay
      render: java

  - type: textarea
    id: environment
    attributes:
      label: Información del ambiente
      description: |
        ```
        - OS: Windows/Mac/Linux
        - Java version: 25
        - Docker version: (si aplica)
        - Branch: main/develop
        ```
    validations:
      required: true

